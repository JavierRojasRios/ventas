<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${nuevo} ? 'Nuevo comercial | Ventas' : 'Editar comercial | Ventas'">Comercial | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom bg-body-tertiary">
        <nav class="container navbar navbar-expand py-2">
            <a class="navbar-brand fw-semibold" th:href="@{/clientes}">Ventas</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link active" th:href="@{/comerciales}">Comerciales</a>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <div class="row">
            <div class="col-12 col-lg-8 col-xl-7">
                <h1 class="h2 mb-4" th:text="${nuevo} ? 'Nuevo comercial' : 'Editar comercial'">Comercial</h1>
                <form th:object="${comercial}" th:action="${nuevo} ? @{/comerciales/crear} : @{/comerciales/editar/{id}(id=${comercial.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" maxlength="100" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="apellido1">Primer apellido</label>
                            <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" maxlength="100" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="apellido2">Segundo apellido</label>
                            <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="comision">Comisión</label>
                            <input class="form-control" id="comision" type="number" step="any" th:field="*{comision}">
                        </div>
                        <div class="col-12 d-flex gap-2 pt-2">
                            <button class="btn btn-primary" type="submit" th:text="${nuevo} ? 'Crear comercial' : 'Guardar cambios'">Guardar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/comerciales}">Cancelar</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
