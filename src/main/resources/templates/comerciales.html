<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comerciales | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom bg-body-tertiary">
        <nav class="container navbar navbar-expand py-2">
            <a class="navbar-brand fw-semibold" th:href="@{/clientes}">Ventas</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link active" th:href="@{/comerciales}">Comerciales</a>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <div class="row align-items-center g-3 mb-3">
            <div class="col-12 col-md">
                <h1 class="h2 mb-1">Comerciales</h1>
                <p class="text-body-secondary mb-0">Gestión de comerciales</p>
            </div>
            <div class="col-12 col-md-auto">
                <a class="btn btn-primary" th:href="@{/comerciales/crear}">Nuevo comercial</a>
            </div>
        </div>
        <div th:if="${mensaje}" class="alert alert-info" role="status" th:text="${mensaje}"></div>
        <div class="row">
            <div class="col-12">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Id</th>
                                <th scope="col">Nombre</th>
                                <th scope="col">Primer apellido</th>
                                <th scope="col">Segundo apellido</th>
                                <th scope="col">Comisión</th>
                                <th scope="col">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="comercial : ${listaComerciales}">
                                <td th:text="${comercial.id}">0</td>
                                <td th:text="${comercial.nombre}">Nombre</td>
                                <td th:text="${comercial.apellido1}">Apellido</td>
                                <td th:text="${comercial.apellido2} ?: '—'">Apellido</td>
                                <td th:text="${comercial.comision} ?: '—'">Comisión</td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">
                                        <a class="btn btn-sm btn-outline-secondary" th:href="@{/comerciales/{id}(id=${comercial.id})}">Ver</a>
                                        <a class="btn btn-sm btn-outline-primary" th:href="@{/comerciales/editar/{id}(id=${comercial.id})}">Editar</a>
                                        <form th:action="@{/comerciales/borrar/{id}(id=${comercial.id})}" method="post">
                                            <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(listaComerciales)}">
                                <td colspan="6" class="text-center text-body-secondary py-4">No hay comerciales registrados.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
