<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom bg-body-tertiary">
        <nav class="container navbar navbar-expand py-2">
            <a class="navbar-brand fw-semibold" th:href="@{/clientes}">Ventas</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/comerciales}">Comerciales</a>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <div class="row">
            <div class="col-12 col-lg-8">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <h1 class="h2 mb-0">Detalle del cliente</h1>
                    <a class="btn btn-outline-primary" th:href="@{/clientes/editar/{id}(id=${cliente.id})}">Editar</a>
                </div>
                <dl class="row">
                    <dt class="col-sm-4">Id</dt><dd class="col-sm-8" th:text="${cliente.id}">0</dd>
                    <dt class="col-sm-4">Nombre</dt><dd class="col-sm-8" th:text="${cliente.nombre}">Nombre</dd>
                    <dt class="col-sm-4">Primer apellido</dt><dd class="col-sm-8" th:text="${cliente.apellido1}">Apellido</dd>
                    <dt class="col-sm-4">Segundo apellido</dt><dd class="col-sm-8" th:text="${cliente.apellido2} ?: '—'">Apellido</dd>
                    <dt class="col-sm-4">Ciudad</dt><dd class="col-sm-8" th:text="${cliente.ciudad} ?: '—'">Ciudad</dd>
                    <dt class="col-sm-4">Categoría</dt><dd class="col-sm-8" th:text="${cliente.categoria} ?: '—'">Categoría</dd>
                </dl>
                <a class="btn btn-secondary" th:href="@{/clientes}">Volver al listado</a>
            </div>
        </div>
    </main>
</body>
</html>
