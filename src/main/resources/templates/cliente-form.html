<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${nuevo} ? 'Nuevo cliente | Ventas' : 'Editar cliente | Ventas'">Cliente | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom bg-body-tertiary">
        <nav class="container navbar navbar-expand py-2">
            <a class="navbar-brand fw-semibold" th:href="@{/clientes}">Ventas</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link active" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/comerciales}">Comerciales</a>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <div class="row">
            <div class="col-12 col-lg-8 col-xl-7">
                <h1 class="h2 mb-4" th:text="${nuevo} ? 'Nuevo cliente' : 'Editar cliente'">Cliente</h1>
                <form th:object="${cliente}" th:action="${nuevo} ? @{/clientes/crear} : @{/clientes/editar/{id}(id=${cliente.id})}" method="post">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="nombre">Nombre</label>
                            <input class="form-control" id="nombre" type="text" th:field="*{nombre}" maxlength="100" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="apellido1">Primer apellido</label>
                            <input class="form-control" id="apellido1" type="text" th:field="*{apellido1}" maxlength="100" required>
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="apellido2">Segundo apellido</label>
                            <input class="form-control" id="apellido2" type="text" th:field="*{apellido2}" maxlength="100">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="ciudad">Ciudad</label>
                            <input class="form-control" id="ciudad" type="text" th:field="*{ciudad}" maxlength="100">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="categoria">Categoría</label>
                            <input class="form-control" id="categoria" type="number" min="0" th:field="*{categoria}">
                        </div>
                        <div class="col-12 d-flex gap-2 pt-2">
                            <button class="btn btn-primary" type="submit" th:text="${nuevo} ? 'Crear cliente' : 'Guardar cambios'">Guardar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/clientes}">Cancelar</a>
                        </div>
                    </div>
                </form>

                <section class="mt-5" th:if="${!nuevo}">
                    <h2 class="h4 mb-3">Comerciales del cliente</h2>
                    <form class="border-top pt-3" th:action="@{/clientes/editar/{id}/comerciales(id=${cliente.id})}" method="post">
                        <div class="row g-3 align-items-end">
                            <div class="col-12 col-md-5">
                                <label class="form-label" for="comercialId">Comercial</label>
                                <select class="form-select" id="comercialId" name="comercialId" required
                                        th:disabled="${#lists.isEmpty(comercialesDisponibles)}">
                                    <option value="" selected disabled>Selecciona un comercial</option>
                                    <option th:each="comercial : ${comercialesDisponibles}"
                                            th:value="${comercial.id}"
                                            th:text="${comercial.nombre + ' ' + comercial.apellido1 + (comercial.apellido2 != null ? ' ' + comercial.apellido2 : '')}">
                                        Nombre Apellido
                                    </option>
                                </select>
                                <div class="form-text" th:if="${#lists.isEmpty(comercialesDisponibles)}">
                                    Todos los comerciales ya están vinculados.
                                </div>
                            </div>
                            <div class="col-12 col-md-3">
                                <label class="form-label" for="fecha">Fecha</label>
                                <input class="form-control" id="fecha" name="fecha" type="date" required>
                            </div>
                            <div class="col-12 col-md-2">
                                <label class="form-label" for="prioridad">Prioridad</label>
                                <input class="form-control" id="prioridad" name="prioridad" type="number" min="1" required>
                            </div>
                            <div class="col-12 col-md-2">
                                <button class="btn btn-primary w-100" type="submit"
                                        th:disabled="${#lists.isEmpty(comercialesDisponibles)}">Añadir Comercial</button>
                            </div>
                        </div>
                    </form>

                    <div class="table-responsive mt-4">
                        <table class="table table-sm align-middle">
                            <thead>
                                <tr>
                                    <th>Comercial</th>
                                    <th>Fecha</th>
                                    <th>Prioridad</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="vinculo : ${comercialesVinculados}">
                                    <td><a class="text-decoration-none"
                                           th:href="@{/comerciales/{id}(id=${vinculo.comercialId})}"
                                           th:text="${vinculo.comercialNombre}">Comercial</a></td>
                                    <td th:text="${vinculo.fecha} ?: '—'">Fecha</td>
                                    <td th:text="${vinculo.prioridad} ?: '—'">Prioridad</td>
                                    <td class="text-end">
                                        <form th:action="@{/clientes/editar/{id}/comerciales/{comercialId}/borrar(id=${cliente.id}, comercialId=${vinculo.comercialId})}"
                                              method="post">
                                            <button class="btn btn-sm btn-outline-danger" type="submit">Borrar</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(comercialesVinculados)}">
                                    <td colspan="4" class="text-body-secondary">No hay comerciales vinculados.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
