<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pedidos | Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="border-bottom bg-body-tertiary">
        <nav class="container navbar navbar-expand py-2">
            <a class="navbar-brand fw-semibold" th:href="@{/pedidos}">Ventas</a>
            <div class="navbar-nav flex-row gap-3">
                <a class="nav-link" th:href="@{/clientes}">Clientes</a>
                <a class="nav-link" th:href="@{/comerciales}">Comerciales</a>
                <a class="nav-link active" th:href="@{/pedidos}">Pedidos</a>
            </div>
        </nav>
    </header>
    <main class="container py-4">
        <div class="row align-items-center g-3 mb-3">
            <div class="col-12 col-md">
                <h1 class="h2 mb-1">Pedidos</h1>
                <p class="text-body-secondary mb-0">Gestión de pedidos</p>
            </div>
            <div class="col-12 col-md-auto">
                <a class="btn btn-primary" th:href="@{/pedidos/crear}">Nuevo pedido</a>
            </div>
        </div>
        <div th:if="${mensaje}" class="alert alert-info" role="status" th:text="${mensaje}"></div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th scope="col">Id</th>
                        <th scope="col">Total</th>
                        <th scope="col">Fecha</th>
                        <th scope="col">Cliente</th>
                        <th scope="col">Comercial</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="detalle : ${listaPedidos}">
                        <td th:text="${detalle.pedido.id}">0</td>
                        <td th:text="${#numbers.formatDecimal(detalle.pedido.total, 1, 2)}">0.00</td>
                        <td th:text="${detalle.pedido.fecha} ?: '—'">Fecha</td>
                        <td th:text="${detalle.clienteNombreCompleto}">Cliente</td>
                        <td th:text="${detalle.comercialNombreCompleto}">Comercial</td>
                        <td>
                            <div class="d-flex flex-wrap gap-2">
                                <a class="btn btn-sm btn-outline-secondary" th:href="@{/pedidos/{id}(id=${detalle.pedido.id})}">Ver</a>
                                <a class="btn btn-sm btn-outline-primary" th:href="@{/pedidos/editar/{id}(id=${detalle.pedido.id})}">Editar</a>
                                <form th:action="@{/pedidos/borrar/{id}(id=${detalle.pedido.id})}" method="post">
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(listaPedidos)}">
                        <td colspan="6" class="text-center text-body-secondary py-4">No hay pedidos registrados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
